<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="robots" content="noindex" />
    <title>ManuGrafias AR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- Brand gradient used by the icons (fill: url(#grad-brand)). -->
    <svg class="defs" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="grad-brand" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#67e8f9" />
          <stop offset="1" stop-color="#c084fc" />
        </linearGradient>
      </defs>
    </svg>

    <!-- MindAR places the camera feed and the A-Frame canvas inside this container. -->
    <div id="ar-container" aria-hidden="true"></div>
    <!-- Video elements used as textures; kept in the DOM but invisible. -->
    <div id="video-host" aria-hidden="true"></div>

    <!-- Ambient neon background of every screen (hidden on the camera screen). -->
    <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

    <!-- 4.1 step 2: loading -->
    <main id="screen-loading" class="screen">
      <div class="brand-mark"><span data-icon="cube"></span></div>
      <p class="logo">ManuGrafias <span class="text-gradient">AR</span></p>
      <div class="spinner" role="status" aria-label="Loading" data-i18n-aria-label="loadingLabel"></div>
    </main>

    <!-- FR-02: welcome screen -->
    <main id="screen-welcome" class="screen screen-welcome" hidden>
      <header class="brand">
        <div class="brand-mark"><span data-icon="cube"></span></div>
        <h1 class="logo">ManuGrafias <span class="text-gradient">AR</span></h1>
        <p class="byline"><span id="photographer-name" class="byline-name"></span></p>
      </header>

      <section class="tips" aria-labelledby="tips-title">
        <h2 id="tips-title" class="eyebrow" data-i18n="tipsTitle">For the best experience</h2>
        <ul class="tip-list">
          <li class="card tip">
            <span class="tip-icon tone-cyan" data-icon="volume"></span>
            <span><strong data-i18n="tipVolumeTitle">Turn up the volume</strong><span data-i18n="tipVolumeBody">Disable silent mode.</span></span>
          </li>
          <li class="card tip">
            <span class="tip-icon tone-purple" data-icon="lightbulb"></span>
            <span><strong data-i18n="tipLightTitle">Find good light</strong><span data-i18n="tipLightBody">Make sure you are in a well-lit place.</span></span>
          </li>
          <li class="card tip">
            <span class="tip-icon tone-blue" data-icon="camera"></span>
            <span><strong data-i18n="tipAimTitle">Point your camera at the artwork</strong><span data-i18n="tipAimBody">And let the magic surprise you.</span></span>
          </li>
        </ul>
      </section>

      <div class="actions">
        <button id="btn-scan" type="button" class="btn btn-primary" disabled aria-busy="true">
          <span data-icon="scan"></span><span id="btn-scan-label" data-i18n="loading">Loading…</span>
        </button>
        <nav id="welcome-links" class="links" aria-label="Photographer links" data-i18n-aria-label="photographerLinks"></nav>
      </div>

      <footer class="footer">
        <a id="privacy-link" class="privacy-link" href="privacy.html" target="_blank" rel="noopener" data-i18n="privacyPolicy">Privacy Policy</a>
      </footer>
    </main>

    <!-- Section 2.4: error and information screens -->
    <main id="screen-message" class="screen screen-message" hidden>
      <div class="brand-mark small"><span data-icon="cube"></span></div>
      <p class="logo small">ManuGrafias <span class="text-gradient">AR</span></p>
      <div class="card message-card">
        <h1 id="message-title" class="message-title"></h1>
        <p id="message-subtitle" class="byline" hidden></p>
        <div id="message-body" class="message-body"></div>
        <div id="message-extra"></div>
      </div>
      <div id="message-actions" class="actions"></div>
    </main>

    <!-- 4.1 step 5: camera screen -->
    <div id="camera-ui" hidden>
      <div id="viewfinder" class="viewfinder" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

      <p id="searching" class="pill searching" role="status"><span class="dot"></span><span data-i18n="searching">Searching for artwork…</span></p>

      <button id="btn-mute" type="button" class="icon-btn" aria-pressed="false" aria-label="Mute" data-i18n-aria-label="mute">
        <span class="icon-on" data-icon="volume"></span>
        <span class="icon-off" data-icon="volumeOff"></span>
      </button>

      <p id="scan-hint" class="pill hint" role="status" data-i18n="scanHint" hidden></p>

      <div id="video-status" class="pill video-status" role="status" hidden>
        <div class="spinner small" aria-hidden="true"></div>
        <span id="video-status-text"></span>
      </div>

      <nav id="camera-links" class="links camera-links" aria-label="Photographer links" data-i18n-aria-label="photographerLinks"></nav>
    </div>

    <noscript>
      <main class="screen"><p class="logo">ManuGrafias AR</p><p>JavaScript is required. / Se necesita JavaScript.</p></main>
    </noscript>
  </body>
</html>
