<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <title>ManuGrafias</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- MindAR places the camera feed and the A-Frame canvas inside this container. -->
    <div id="ar-container" aria-hidden="true"></div>
    <!-- Video elements used as textures; kept in the DOM but invisible. -->
    <div id="video-host" aria-hidden="true"></div>

    <!-- 4.1 step 2: loading -->
    <main id="screen-loading" class="screen">
      <p class="logo">ManuGrafias</p>
      <div class="spinner" role="status" aria-label="Loading"></div>
    </main>

    <!-- FR-02: welcome screen -->
    <main id="screen-welcome" class="screen" hidden>
      <h1 class="logo">ManuGrafias</h1>
      <p id="photographer-name" class="photographer"></p>
      <p id="instructions" class="instructions"></p>
      <div class="actions">
        <button id="btn-scan" type="button" class="btn btn-primary" disabled aria-busy="true">Loading…</button>
        <a id="welcome-website" class="btn btn-secondary" target="_blank" rel="noopener noreferrer">Visit Website</a>
      </div>
      <a class="privacy-link" href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>
    </main>

    <!-- Section 2.4: error and information screens -->
    <main id="screen-message" class="screen" hidden>
      <p class="logo">ManuGrafias</p>
      <h1 id="message-title" class="message-title"></h1>
      <p id="message-subtitle" class="photographer" hidden></p>
      <div id="message-body" class="message-body"></div>
      <div id="message-extra"></div>
      <div id="message-actions" class="actions"></div>
    </main>

    <!-- 4.1 step 5: camera screen -->
    <div id="camera-ui" hidden>
      <button id="btn-mute" type="button" class="icon-btn" aria-pressed="false" aria-label="Mute">
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" />
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.5 2.5V12zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A9 9 0 0 0 14 3.2v2.1a7 7 0 0 1 5 6.7zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3L4.3 3zM12 4 9.9 6.1 12 8.2V4z" />
        </svg>
      </button>

      <p id="scan-hint" class="hint" role="status" hidden></p>

      <div id="video-status" class="video-status" role="status" hidden>
        <div class="spinner small" aria-hidden="true"></div>
        <span id="video-status-text"></span>
      </div>

      <a id="camera-website" class="btn btn-secondary camera-website" target="_blank" rel="noopener noreferrer">Visit Website</a>
    </div>

    <noscript>
      <main class="screen"><p class="logo">ManuGrafias</p><p>JavaScript is required.</p></main>
    </noscript>
  </body>
</html>
