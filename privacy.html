<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Privacy Policy - ManuGrafias</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      html, body { overflow: auto; }
      .policy { max-width: 40rem; margin: 0 auto; padding: calc(24px + var(--safe-top)) 20px calc(40px + var(--safe-bottom)); line-height: 1.6; }
      .policy h1 { font-size: 1.5rem; margin: 24px 0 8px; }
      .policy h2 { font-size: 1rem; margin: 20px 0 4px; }
      .policy p { margin: 0; color: var(--muted); }
      .policy a { color: var(--fg); }
    </style>
    <script type="module">
      import { setupLanguage } from './js/i18n/index.js';

      const CONTACT_EMAIL = 'manfer93@gmail.com';
      const { strings } = setupLanguage();
      const policy = strings.privacy;
      const main = document.getElementById('policy');
      const el = (tag, text) => Object.assign(document.createElement(tag), { textContent: text });

      document.title = policy.pageTitle;
      main.replaceChildren(el('p', 'ManuGrafias'), el('h1', policy.title), el('p', policy.intro));
      main.firstChild.className = 'logo';
      for (const section of policy.sections) main.append(el('h2', section.heading), el('p', section.body));

      const contact = el('p', `${policy.contactBody} `);
      const link = el('a', CONTACT_EMAIL);
      link.href = `mailto:${CONTACT_EMAIL}`;
      contact.append(link, '.');
      main.append(el('h2', policy.contactHeading), contact);
    </script>
  </head>
  <body>
    <main id="policy" class="policy">
      <p class="logo">ManuGrafias</p>
      <noscript><p>JavaScript is required. / Se necesita JavaScript.</p></noscript>
    </main>
  </body>
</html>
